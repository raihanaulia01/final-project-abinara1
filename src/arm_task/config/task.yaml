task:
  joint_names: [base, shoulder, elbow, wrist]
  home_q: [0.0, 1.57, 0.0, 0.0]

  # ---- grasp geometry (side grasp of the round web) -----------------------------------
  grasp_pitch_deg: -25.0                    # Gripper pitch for every waypoint
  allow_tilt: false                         # false = hold grasp_pitch_deg (pls don't set this to true)
  web_center_z: 0.05                        # tool height at the pillar centre (flanges 10 mm, web 40 mm)
  block_width: 0.05
  block_height: 0.06
  approach_distance: 0.06                   # straight-line run-in along the finger axis
  approach_fallbacks: [0.06, 0.04, 0.02]    # shorter run-ins tried if the pre-point is out of joint limits
  lift: 0.1                                 # lift after closing, so the block is clear of the table
  travel_z: 0.25                            # tool height while moving
  release_margin: 0.006                     # release 3 mm above contact

  # ---- pyramid ------------------------------------------------------------------------
  stack_yaw_deg: -70.0
  stack_radius: 0.290
  row_gap: 0.02

  # ---- block selection ----------------------------------------------------------------
  ignore_yaw_below_deg: -51.0      # hides placed blocks
  pick_r_min: 0.25
  pick_r_max: 0.33
  min_clearance: 0.0001            # centre-to-centre; closer blocks merge in the detector
  corridor_half_width: 0.04
  corridor_extra: 0.05
  blacklist_radius: 0.02
  max_attempts: 2

  # ---- timing -------------------------------------------------------------------------
  joint_speed: 0.5
  settle_time: 0.7
  gripper_close_time: 3
  gripper_open_time: 1.5
  detection_timeout: 1.0
  look_timeout: 5.0
  use_presence: false