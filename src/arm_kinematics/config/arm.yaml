arm:
  # With PWM servos this is the last commanded pose, not actual feedback from the servo
  # (model frame, rad: q1 CCW yaw, q2 = 0 horizontal and positive raises, q3/q4 relative to
  # the previous link, negative elbow = bent down, pitch = q2 + q3 + q4)
  initial_q: [0.0, 0.0, 0.0, 0.0]
  # origin / rpy / axis are copied from robot_arm_1.urdf.
  # direction / offset convert the MODEL-frame q to the URDF joint value:
  #     urdf_value = direction * q + offset
  # (servo2/3 pitch DOWN for positive URDF values and the URDF zero pose is not flat,
  #  so without this the IK and the pitch constraint are wrong)
  chain:
    - origin: [0.007168, 0.0, 0.1125]
      rpy: [0.0, 0.0, 0.0]
      axis: [0.0, 0.0, -1.0]
      direction: -1.0
      offset: 0.0
    - origin: [0.0024206, -0.045, 0.04035]
      rpy: [1.5708, 0.0, 0.0]
      axis: [0.0, 0.0, -1.0]
      direction: -1.0
      offset: 0.8451623297845661
    - origin: [0.08209, 0.092539, 0.0]
      rpy: [0.0, 0.0, 0.0]
      axis: [0.0, 0.0, -1.0]
      direction: -1.0
      offset: -1.0275833711790798
    - origin: [0.12165, -0.022441, 0.0]
      rpy: [0.0, 0.0, 0.0]
      axis: [0.0, 0.0, 1.0]
      direction: 1.0
      offset: 0.17853895860548616
  snap_axis_tol_deg: 5.0
  tcp:
    origin: [0.093616, -0.023850, -0.046608]
    rpy: [0.0, 0.0, 0.0]
  joints:
    limits:
      # raw joint limits
      # - [-1.523, 1.523] 
      # - [-1.523, 1.523]
      # - [-1.319, 1.523]
      # - [-1.523, 1.523]

      # - [-1.523, 1.523]     # base
      # - [0.048, 3.094]      # shoulder  (servo + 90 deg)
      # - [-1.930, 0.912]     # elbow     (servo - 35 deg)
      # - [-1.523, 1.523]     # wrist
      
      - [-1.523, 1.523]     # base  (-87.3 .. 87.3 deg)
      - [-0.126, 2.919]     # shoulder  (-7.2 .. 167.2 deg)
      - [-2.017, 0.824]     # elbow  (-115.6 .. 47.2 deg)
      - [-1.697, 1.348]     # wrist  (-97.2 .. 77.2 deg)
    zero_deg: [0, -80, 40, 10]
    direction: [1.0, 1.0, 1.0, 1.0]
  floor_clearance: 0.01
  ik:
    max_iterations: 250
    tolerance: 1.0e-5
    damping: 0.1